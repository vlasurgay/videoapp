#server
server.port=${WEB_SERVER_PORT:8080}
#aws
aws.s3.bucket.name=${AWS_S3_BUCKET:}
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:eu-central-1}
is.s3.mode.enabled=${IS_S3_MODE_ENABLED:true}
aws.s3.presigned-url-lifetime-min=180000
#db
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:10}
spring.jpa.packages-to-scan=vlsurhai.storage
