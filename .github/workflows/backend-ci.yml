name: videoapp-ci

env:
  ENVIRONMENT: dev
  PROJECT: videoapp
  AWS_REGION: eu-central-1
  IAM_ECR_ROLE_ARN: arn:aws:iam::342050997730:role/videoapp-dev-342050997730-github-actions-deploy-videoapp
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: set up java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: build and verify
        run: mvn --batch-mode --no-transfer-progress verify

  login_and_push:
    name: login to aws, build docker and push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: aws configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login to aws ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: resolve image names
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ECR_PREFIX="${REGISTRY}/${PROJECT}-${ENVIRONMENT}-${REGISTRY%%.*}"
          echo "WEB_IMAGE=${ECR_PREFIX}-web" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${ECR_PREFIX}-worker" >> "$GITHUB_ENV"

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push videoapp-web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: videoapp-web
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=videoapp
          cache-to: type=gha,mode=max,scope=videoapp

      - name: Build and push videoapp-worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: videoapp-worker
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=videoapp
          cache-to: type=gha,mode=max,scope=videoapp


  deploy:
    name: deploy to EC2
    runs-on: ubuntu-latest
    needs: login_and_push
    concurrency:
      group: deploy-ec2
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out deploy files
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: aws configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        shell: bash
        env:
          TAG: ${{ github.sha }}
        run: |
          REMOTE=$(cat << 'SCRIPT'
            cd /opt/videoapp
            export PATH="$PATH:/snap/bin"
                      
            PARAMS=$(
              aws ssm get-parameters-by-path --region "$AWS_REGION"  \
              --path "/$PROJECT/$ENVIRONMENT/runtime/"  \
              --query 'Parameters[].[Name,Value]' --output text
            )
            DB_PASSWORD=$(
              aws ssm get-parameter --region "$AWS_REGION" \
              --name "/$PROJECT/$ENVIRONMENT/secrets/DB_PASSWORD" --with-decryption \
              --query Parameter.Value --output text
            )
            {
              printf '%s\n' "$PARAMS" | while read -r name value; do
              echo "${name##*/}=${value}"
              done
              echo "DB_PASSWORD='$DB_PASSWORD'"
            } > .env.new
            chmod 600 .env.new
            mv .env.new .env
          
            ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"   
          
            export ECR_PREFIX="$REGISTRY/$PROJECT-$ENVIRONMENT-$ACCOUNT_ID"
          
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans --wait --wait-timeout 120
            docker image prune -f
          SCRIPT)
            
          COMPOSE_B64=$(base64 -w0 docker-compose.dev.yml)
          
          PAYLOAD=$(REMOTE="$REMOTE" COMPOSE_B64="$COMPOSE_B64" python3 << 'PY'
          import json, os
          e = os.environ
          commands = [
          "set -eu",
          f"export TAG={e['TAG']} PROJECT={e['PROJECT']} ENVIRONMENT={e['ENVIRONMENT']} AWS_REGION={e['AWS_REGION']}",
          f"echo {e['COMPOSE_B64']} | base64 -d > /opt/videoapp/docker-compose.dev.yml",
          e["REMOTE"]
          ]
          payload = {"commands": commands}
          print(json.dumps(payload))
          PY)

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT}-${ENVIRONMENT}-*-ec2" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "no ec2 instances found"
            exit 1
          fi
          
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PAYLOAD" \
            --query Command.CommandId --output text)
          
          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 10
            STATUS=$(
              aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending
            )
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          
            echo "ssm status: $STATUS"
            [ "$STATUS" = "Success" ]