name: videoapp-ci

on:
  push:
    branches:
      - master
      - cicd-terraform-aws-prep
  pull_request:
    branches:
      - master
      - cicd-terraform-aws-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: set up java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: build and verify
        run: mvn --batch-mode --no-transfer-progress verify