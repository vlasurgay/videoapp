services:

  videoapp-db:
    image: postgres:16
    restart: always
    container_name: videoapp-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "5433:8080"
    depends_on:
      - videoapp-db

  videoapp-web:
    build:
      context: .
      target: videoapp-web
    env_file:
      - .env
    environment:
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    image: videoapp-web:latest
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - type: bind
        source: "${USERPROFILE}/.aws/config"
        target: /root/.aws/config
        read_only: true
      - type: bind
        source: "${USERPROFILE}/.aws/sso/cache"
        target: /root/.aws/sso/cache
    depends_on:
      videoapp-db:
        condition: service_healthy

  videoapp-worker:
    build:
      context: .
      target: ${WORKER_BUILD_TARGET:-videoapp-worker}
    env_file:
      - .env
    environment:
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    image: videoapp-worker:latest
    depends_on:
      videoapp-db:
        condition: service_healthy
    deploy:
      replicas: 1
    volumes:
      - type: bind
        source: "${USERPROFILE}/.aws/config"
        target: /root/.aws/config
        read_only: true
      - type: bind
        source: "${USERPROFILE}/.aws/sso/cache"
        target: /root/.aws/sso/cache
      - ./docker_cache/huggingface:/opt/huggingface-cache
      - ./docker_cache/torch:/opt/torch-cache
      - ./docker_cache/tts:/root/.local/share/tts
    ports:
      - "5006:5006"

volumes:
  pgdata: