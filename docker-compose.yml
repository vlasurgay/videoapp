services:
  videoapp-db:
    image: postgres:16
    restart: always
    container_name: videoapp-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    restart: always
    ports:
      - "5433:8080"
    depends_on:
      - videoapp-db
  videoapp-web:
    build:
      context: .
      target: videoapp-web
    env_file:
      - .env
    image: videoapp-web:latest
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      videoapp-db:
        condition: service_healthy
  videoapp-worker:
    build:
      context: .
      target: videoapp-worker
    env_file:
      - .env
    ports:
      - "5006:5006"
    image: videoapp-worker:latest
    depends_on:
      videoapp-db:
        condition: service_healthy
    deploy:
      replicas: 1
volumes:
  pgdata: