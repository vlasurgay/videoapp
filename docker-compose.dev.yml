services:
  videoapp-db:
    image: postgres:16
    restart: unless-stopped
    container_name: videoapp-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  videoapp-web:
    image: ${ECR_PREFIX}-web:${TAG}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_MODE_ENABLED: ${AI_MODE_ENABLED:-}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      videoapp-db:
        condition: service_healthy

  videoapp-worker:
    image: ${ECR_PREFIX}-worker:${TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      videoapp-db:
        condition: service_healthy

volumes:
  pgdata: